#cloud-config
autoinstall:
  version: 1
  locale: es_ES.UTF-8
  keyboard:
    layout: es

  # Pausa interactiva para pedir usuario y contraseña en pantalla
  interactive-sections:
    - identity

  identity:
    hostname: ubuntu-workstation
    username: usuario

  ssh:
    install-server: true
    allow-pw: true

  storage:
    layout:
      name: lvm

  # Repositorios oficiales de Ubuntu (APT)
  packages:
    - apt-transport-https
    - bsdutils
    - build-essential
    - ca-certificates
    - chrome-gnome-shell
    - cookiecutter
    - cron
    - curl
    - dash
    - diffutils
    - eea
    - efibootmgr
    - findutils
    - git
    - gnome-user-docs-es
    - gnupg
    - grep
    - grub-efi-amd64
    - grub-efi-amd64-signed
    - gzip
    - hostname
    - hyphen-es
    - ibus-table-cangjie-big
    - ibus-table-cangjie3
    - ibus-table-cangjie5
    - init
    - input-remapper
    - kolourpaint
    - language-pack-es
    - language-pack-es-base
    - language-pack-gnome-es
    - language-pack-gnome-es-base
    - libbz2-dev
    - libcharon-extra-plugins
    - libchewing3
    - libchewing3-data
    - libffi-dev
    - liblzma-dev
    - libm17n-0
    - libmarisa0
    - libncurses-dev
    - libopencc-data
    - libopencc1.1
    - libotf1
    - libpinyin-data
    - libpinyin15
    - libreadline-dev
    - libreoffice-help-common
    - libreoffice-help-es
    - libreoffice-l10n-es
    - libsqlite3-dev
    - libssl-dev
    - libxml2-dev
    - libxmlsec1-dev
    - linux-generic-hwe-24.04
    - login
    - lsb-release
    - m17n-db
    - make
    - mysql-client
    - mythes-es
    - ncurses-base
    - ncurses-bin
    - npm
    - openfortivpn
    - pipx
    - pv
    - python3-netifaces
    - python3-pip
    - python3-venv
    - python3-virtualenv
    - shim-signed
    - software-properties-common
    - sshpass
    - strongswan
    - strongswan-pki
    - thunderbird-locale-es
    - thunderbird-locale-es-ar
    - thunderbird-locale-es-es
    - tk-dev
    - ubuntu-desktop
    - ubuntu-desktop-minimal
    - ubuntu-minimal
    - ubuntu-restricted-addons
    - ubuntu-standard
    - ubuntu-wallpapers
    - vim
    - wpasupplicant
    - xz-utils
    - zlib1g-dev

  # Aplicaciones movidas a la tienda de Snap
  snaps:
    - name: aws-cli
      classic: true
    - name: azure-cli
      classic: true
    - name: code
      classic: true
    - name: dbeaver-ce
    - name: discord
    - name: docker
    - name: firefox
    - name: forticlient-vpn
    - name: k6
    - name: k9s
      classic: true
    - name: microk8s
      classic: true
    - name: mysql-shell
    - name: pinta
    - name: remmina
    - name: slack
    - name: spotify
    - name: termdown
    - name: terraform
      classic: true
    - name: thunderbird

  # Google Chrome no existe en la tienda oficial de Snap.
  # Esta instrucción lo descarga e instala automáticamente al finalizar la instalación base.
  late-commands:
    - curtin in-target -- bash -c "curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb && apt-get install -y /tmp/chrome.deb && rm /tmp/chrome.deb"
